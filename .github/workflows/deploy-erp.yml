name: Deploy Bhachunda Solar ERP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "erp-foundation/apps/web/**"
      - "erp-foundation/supabase/functions/**"
      - "erp-foundation/supabase/tests/**"
      - "erp-foundation/shared/**"
      - ".github/workflows/deploy-erp.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-foundation/apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: erp-foundation/apps/web/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build the ERP
        run: npm run build

      - name: Check consent and document permissions
        run: npm run test:integration

      - name: Prepare isolated browser verification
        working-directory: .
        run: |
          npm install --prefix "$RUNNER_TEMP/erp-browser-qa" --no-audit --no-fund --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/erp-browser-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify consent generator and English/Gujarati PDF
        working-directory: .
        env:
          ERP_QA_NODE_MODULES: ${{ runner.temp }}/erp-browser-qa/node_modules
        run: node .github/scripts/verify-consent-generator.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: consent-generator-verification
          path: consent-qa/
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: erp-foundation/apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
