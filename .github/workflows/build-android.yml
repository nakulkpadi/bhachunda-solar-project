name: Build native Bhachunda Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['erp-foundation/apps/android/**', 'erp-foundation/shared/**', '.github/workflows/build-android.yml']
permissions:
  contents: read
concurrency:
  group: bhachunda-android
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: erp-foundation/apps/android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: { gradle-version: '8.11.1' }
      - name: Unit tests, lint and debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Native Android UI, map and encrypted-session tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: erp-foundation/apps/android
          script: |
            gradle :app:connectedDebugAndroidTest --no-daemon
            mkdir -p qa
            adb pull /sdcard/bhachunda-qa/. qa/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bhachunda-android-test-results
          path: |
            erp-foundation/apps/android/app/build/reports/
            erp-foundation/apps/android/qa/
          retention-days: 30
  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: erp-foundation/apps/android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: { gradle-version: '8.11.1' }
      - name: Build signed release and encrypted signing backup
        env:
          SIGNING_KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/bhachunda-sign.XXXXXX")
          trap 'rm -rf "$signing_dir"' EXIT
          export APK_KEYSTORE="$signing_dir/release-signing.p12"
          if [ -n "$SIGNING_KEY_B64" ]; then
            printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$APK_KEYSTORE"
            export APK_KEYSTORE_PASSWORD="$SIGNING_PASSWORD"
            test -n "$APK_KEYSTORE_PASSWORD"
          else
            export APK_KEYSTORE_PASSWORD=$(openssl rand -base64 36)
            echo "::add-mask::$APK_KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$APK_KEYSTORE" -storetype PKCS12 -alias bhachunda-erp -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Bhachunda Solar ERP, O=Bhachunda Project, C=IN' -storepass "$APK_KEYSTORE_PASSWORD" -keypass "$APK_KEYSTORE_PASSWORD" -noprompt > /dev/null 2>&1
          fi
          gradle :app:assembleRelease --no-daemon
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/Bhachunda-ERP-1.0.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs output/Bhachunda-ERP-1.0.1.apk > output/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging output/Bhachunda-ERP-1.0.1.apk > output/package-info.txt
          sha256sum output/Bhachunda-ERP-1.0.1.apk > output/SHA256SUMS.txt
          printf '%s' "$APK_KEYSTORE_PASSWORD" > "$signing_dir/keystore-password.txt"
          tar -C "$signing_dir" -cf "$signing_dir/signing-backup.tar" release-signing.p12 keystore-password.txt
          openssl cms -encrypt -binary -aes-256-cbc -in "$signing_dir/signing-backup.tar" -out output/signing-backup.cms -outform DER signing-backup-certificate.pem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bhachunda-android-signed
          path: erp-foundation/apps/android/output/
          if-no-files-found: error
          retention-days: 90
  install-check:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: bhachunda-android-signed, path: android-apk }
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install and launch the signed release APK
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install android-apk/Bhachunda-ERP-1.0.1.apk
            adb logcat -c
            adb shell am start -W -n com.bhachunda.erp/.MainActivity
            sleep 8
            adb shell pidof com.bhachunda.erp
            adb shell uiautomator dump /sdcard/release-ui.xml
            adb pull /sdcard/release-ui.xml android-apk/release-ui.xml
            python3 -c 'from pathlib import Path; s=Path("android-apk/release-ui.xml").read_text(); assert "Sign in" in s and "Email address" in s, "Native sign-in screen is missing"'
            adb shell screencap -p /sdcard/release-login.png
            adb pull /sdcard/release-login.png android-apk/release-login.png
            if adb logcat -d -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION'; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bhachunda-android-install-check
          path: android-apk/release-*
          retention-days: 30

