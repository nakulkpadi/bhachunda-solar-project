# Edge Functions authenticate users inside their handlers so CORS preflight and
# the Google OAuth redirect can reach the code. The two browser-facing
# functions verify a Supabase user token and role before doing any work; the
# callback validates a single-use, short-lived OAuth state before it can write
# a credential.

[functions.drive-oauth-start]
verify_jwt = false

[functions.drive-oauth-callback]
verify_jwt = false

[functions.drive-connection-status]
verify_jwt = false

[functions.drive-upload]
verify_jwt = false

# Every request is verified with auth.getUser and fresh approved profile roles.
[functions.consent-drafts]
verify_jwt = false

[functions.parcel-detail]
verify_jwt = true

[functions.owner-details]
verify_jwt = true

[functions.drive-document]
verify_jwt = true

[functions.drive-files]
verify_jwt = true

[functions.drive-folder-setup]
verify_jwt = true

[functions.manage-users]
verify_jwt = true

[functions.patel-report]
verify_jwt = true
